name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: dart pub get
        working-directory: functions/phone-login
      - run: dart test
        working-directory: functions/phone-login
      - run: dart pub get
        working-directory: functions/payments
      - run: dart test
        working-directory: functions/payments
